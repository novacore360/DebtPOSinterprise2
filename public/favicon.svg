<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4e73df;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1cc88a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8f4ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Shopping bag body -->
  <rect x="120" y="200" width="272" height="220" rx="18" fill="url(#icon)" opacity="0.95"/>
  <!-- Bag handle -->
  <path d="M192 200 C192 140 192 112 256 112 C320 112 320 140 320 200" stroke="white" stroke-width="28" stroke-linecap="round" fill="none" opacity="0.95"/>
  <!-- Peso sign -->
  <text x="256" y="340" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="90" font-weight="900" fill="#4e73df">₱</text>
</svg>
